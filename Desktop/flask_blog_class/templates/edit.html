{% extends 'base.html' %}

{% block content %}
    <h1>{% block title %} Edit "{{ post['title'] }}" {% endblock %}</h1>
    <form method="post">
        <label for="title">Title</label>
        <input type="text" name="title" placeholder="Post title" value="{{ request.form['title'] or post['title'] }}">

        <label for="content">Content</label>
        <textarea name="content" placeholder="Post content" rows="10">{{ request.form['content'] or post['content'] }}</textarea>

        <button type="submit">Submit</button>
    </form>
{% endblock %}

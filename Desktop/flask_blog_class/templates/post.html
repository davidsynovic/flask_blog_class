{% extends 'base.html' %}

{% block content %}
    <h2>{% block title %} {{ post['title'] }} {% endblock %}</h2>
    <span class="span-date">{{ post['created'] }}</span>
    <div class="post-body">
        <p>{{ post['content'] }}</p>
    </div>
    <a href="{{ url_for('edit', id=post['id']) }}" class="btn">Edit Post</a>
    <form action="{{ url_for('delete', id=post['id']) }}" method="POST" style="display:inline;">
        <button type="submit" onclick="return confirm('Are you sure you want to delete this post?')" style="background: #dc3545;">Delete Post</button>
    </form>
{% endblock %}
